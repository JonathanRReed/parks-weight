<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0e0c">
  <meta name="description" content="Stack real U.S. national park maps at true size. 63 parks, acres, visitors, and facts.">
  <title>Park / Weight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.v7.css">
</head>
<body>
  <svg class="sprites" aria-hidden="true" focusable="false">
    <symbol id="i-stack" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M4 14l8 4 8-4M4 10l8 4 8-4M4 6l8 4 8-4"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 21s7-5.4 7-11a7 7 0 10-14 0c0 5.6 7 11 7 11z"/><circle cx="12" cy="10" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="M20 20l-3-3"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M7 7h11M15 3l4 4-4 4M17 17H6M9 13l-4 4 4 4"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M16 3h5v5M4 20l6-6M21 3l-8 8M16 21h5v-5M15 15l6 6"/></symbol>
    <symbol id="i-north" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3l4 8h-3v10h-2V11H8z"/></symbol>
    <symbol id="i-land" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M3 18l5-8 4 5 3-4 6 7H3z"/></symbol>
  </svg>

  <div id="onboard" class="onboard" hidden>
    <div class="onboard-card">
      <p class="kicker"><svg><use href="#i-stack"/></svg> Quick start</p>
      <h2 id="obTitle"></h2>
      <p id="obCopy"></p>
      <div class="onboard-nav">
        <button type="button" class="ghost" id="obSkip">Skip</button>
        <button type="button" class="primary" id="obNext">Next</button>
      </div>
      <p class="dots" id="obDots"></p>
    </div>
  </div>

  <header>
    <p class="brand"><svg><use href="#i-stack"/></svg> Park / Weight</p>
    <div class="tools">
      <button type="button" id="btnShuffle" title="Try a random pair"><svg><use href="#i-shuffle"/></svg> Surprise me</button>
      <button type="button" id="btnHelp" title="How this works"><svg><use href="#i-stack"/></svg> How it works</button>
    </div>
  </header>

  <main>
    <h1>See how two parks stack.</h1>
    <p class="lead">Real park maps, same scale. Tap a photo to change parks.</p>

    <div class="pickers">
      <button type="button" class="picker" id="pickBig">
        <span class="photo" id="bigPhoto"></span>
        <span>
          <small><svg><use href="#i-land"/></svg> Bigger park</small>
          <strong id="bigName">Yellowstone</strong>
        </span>
      </button>
      <button type="button" class="icon-btn" id="btnSwap" title="Swap parks"><svg><use href="#i-swap"/></svg></button>
      <button type="button" class="picker" id="pickSmall">
        <span class="photo" id="smallPhoto"></span>
        <span>
          <small><svg><use href="#i-pin"/></svg> Park on top</small>
          <strong id="smallName">Arches</strong>
        </span>
      </button>
    </div>

    <section class="workspace">
      <div class="stage">
        <svg id="map" viewBox="-100 -100 200 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Two park maps stacked at true size"></svg>
        <p class="north" title="North is up"><svg><use href="#i-north"/></svg> N</p>
        <p class="hint" id="hint"></p>
      </div>
      <aside class="facts" id="factsPanel">
        <p class="kicker" id="factKicker"></p>
        <h2 id="factName"></h2>
        <dl id="factStats"></dl>
        <p id="factCopy"></p>
        <p class="extra" id="factExtra"></p>
      </aside>
    </section>

    <p class="punch" id="punch"></p>

    <section class="chooser" id="chooser" hidden>
      <div class="chooser-bar">
        <h2 id="chooserTitle">Pick a park</h2>
        <button type="button" class="icon-btn" id="closeChooser" title="Close"><svg><use href="#i-x"/></svg></button>
      </div>
      <label class="search">
        <svg><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Type a park name">
      </label>
      <div class="cards" id="chooserCards"></div>
    </section>

    <section class="all">
      <h2>Tap any park to set it as the one on top</h2>
      <div class="cards" id="allCards"></div>
    </section>
  </main>

  <footer>National Park Service maps · 2023 acreage and visitors · not an official NPS site</footer>
  <script src="app.v7.js"></script>
</body>
</html>
